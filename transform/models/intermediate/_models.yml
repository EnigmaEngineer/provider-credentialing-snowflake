version: 2

models:
  - name: int_screening__match_candidate
    description: >
      One row per provider and exclusion record a tier matched them to. Pair
      grained, because a provider grained answer cannot say which record a
      tier reached and a tier that flags the right provider against the wrong
      record looks correct on any count of providers.
    columns:
      - name: provider_id
        tests: [not_null]
      - name: tier
        tests:
          - not_null
          - accepted_values:
              values: ["tier1_identifier", "tier2_name_and_dob", "tier3_name_state"]
      - name: tier_rank
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
              quote: false

  - name: int_screening__provider_screening
    description: >
      One row per provider carrying the strongest tier that reached them. A
      provider with no tier is one the platform clears with nobody looking,
      which is the set worth counting.
    columns:
      - name: provider_id
        tests: [unique, not_null]
      - name: cleared_without_review
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: records_matched
        tests: [not_null]

  - name: int_screening__screening_currency
    description: >
      One row per provider saying whether the screening on file still stands.
      Three things retire one and only the first is the calendar: the window,
      the file the screening was taken against, and a change to an attribute a
      match was made on.
    columns:
      - name: provider_id
        tests: [unique, not_null]
      - name: is_active
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: outside_window
        tests: [not_null]
      - name: screening_is_void
        tests: [not_null]
      - name: digests_on_the_latest_cycle
        # More than one digest on the latest cycle date means two files were in
        # use at once, and then the current one is whichever sorted first.
        tests:
          - accepted_values:
              values: [1]
              quote: false
