name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # No downloads. Every check reads a committed fixture, which is the
      # point of committing them.
      - name: checks
        run: python tests/run_all.py

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: formatting
        run: terraform -chdir=infra fmt -check -diff

      # No backend and no credentials. This grades the configuration against
      # the provider schema and nothing else, and it cannot see an argument
      # nobody wrote, which is what the suite above is for.
      - name: init
        run: terraform -chdir=infra init -backend=false -input=false

      - name: validate
        run: terraform -chdir=infra validate

  transform:
    # The only job here that runs the models. It builds them on a local engine
    # on every pull request, so a model that no longer compiles fails before a
    # review rather than on the first day this project has a warehouse.
    #
    # `dbt build` and not a sequence of commands. The snapshots read the
    # staging models, so an order written by hand is the one thing this job
    # must not contain. The monthly cycle solves the same problem by deriving
    # the order, in `orchestration/cycle.py`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install
        run: python -m pip install -r requirements-transform.txt

      - name: seed
        run: cd transform && DBT_PROFILES_DIR=profiles dbt seed --target duckdb

      - name: build
        run: cd transform && DBT_PROFILES_DIR=profiles dbt build --target duckdb --exclude resource_type:seed

      # A parse against the warehouse adapter resolves every relation name
      # without a connection. It does not compile the warehouse SQL.
      - name: parse against the warehouse adapter
        run: cd transform && DBT_PROFILES_DIR=profiles dbt parse --target snowflake

  clone:
    # The zero copy clone per pull request. There is no Snowflake account for
    # this project, so this job has nothing to clone from and is held off
    # rather than left to fail on every pull request.
    #
    # The statements are not written here. `orchestration/clone.py` builds
    # them and the suite grades the name and the lifecycle, because SQL inside
    # a YAML string is read by nothing. The teardown is unconditional, which
    # is the whole argument for the job having a teardown step at all.
    if: false
    needs: [suite, configuration, transform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install
        run: python -m pip install -r requirements-transform.txt

      - name: clone the marts
        env:
          PR: ${{ github.event.number }}
        run: python -m orchestration.clone create "$PR" | snow sql --stdin

      - name: build against the clone
        env:
          PR: ${{ github.event.number }}
          # The profile reads SNOWFLAKE_DATABASE. This step used to set
          # DBT_DATABASE, which the profile does not read, so the build would
          # have run against the fallback and the fallback is the database the
          # clone exists to keep out of a pull request's way.
          SNOWFLAKE_DATABASE: ${{ format('SCREENING_CI_PR_{0}', github.event.number) }}
          # And onto the warehouse that was created for this and named by
          # nothing until today.
          SNOWFLAKE_WAREHOUSE: SCREENING_CI_WH
        run: cd transform && DBT_PROFILES_DIR=profiles dbt build --target snowflake

      - name: drop the clone
        if: always()
        env:
          PR: ${{ github.event.number }}
        run: python -m orchestration.clone drop "$PR" | snow sql --stdin

  deploy:
    # Nothing to deploy to. There is no Snowflake account for this project and
    # no service user, so this job has no identity to assume and is held off
    # rather than left to fail on every push. The step below is the shape the
    # deploy takes once the account exists.
    if: false
    needs: [suite, configuration, transform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # The runner is issued a token, writes it to a file, and the provider
      # reads the file. Nothing long lived is stored anywhere.
      - name: identity token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=snowflake" \
            | python -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])" \
            > "$RUNNER_TEMP/snowflake-oidc-token"

      - name: apply
        env:
          SNOWFLAKE_TOKEN_FILE_PATH: ${{ runner.temp }}/snowflake-oidc-token
          # Thirteen variables below have no default and are not passed here.
          # That gap is deliberate and tests/test_workflow.py names every one
          # of them. Wiring them to repository variables that do not exist yet
          # would be worse rather than better: an unset `vars.X` renders as an
          # empty string, so a required string variable would arrive empty and
          # apply, where today it stops with the variable named.
          TF_VAR_organization_name: ${{ vars.SNOWFLAKE_ORGANIZATION }}
          TF_VAR_account_name: ${{ vars.SNOWFLAKE_ACCOUNT }}
          TF_VAR_ci_user_name: ${{ vars.SNOWFLAKE_CI_USER }}
          TF_VAR_deploy_warehouse_name: ${{ vars.SNOWFLAKE_DEPLOY_WAREHOUSE }}
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra apply -auto-approve
